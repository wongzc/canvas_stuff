 <head>

  <style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans SC',sans-serif}
.app-wrap{height:100%;width:100%;overflow-y:auto;background:#0a1628;scrollbar-gutter:stable}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1)}
.glow-green{box-shadow:0 0 30px rgba(74,222,128,0.15)}
.glow-blue{box-shadow:0 0 30px rgba(96,165,250,0.15)}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.q-card{transition:all .3s ease}
.q-card:hover{transform:translateY(-2px)}
input[type="text"],textarea{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#e2e8f0;border-radius:8px;padding:10px 14px;width:100%;font-family:'Noto Sans SC',sans-serif;transition:border-color .2s}
input[type="text"]:focus,textarea:focus{outline:none;border-color:#4ade80}
textarea{resize:vertical;min-height:80px}
.choice-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#cbd5e1;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all .2s;font-family:'Noto Sans SC',sans-serif;font-size:14px}
.choice-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25)}
.choice-btn.selected{background:rgba(74,222,128,0.15);border-color:#4ade80;color:#4ade80}
.choice-btn.correct{background:rgba(74,222,128,0.2);border-color:#4ade80;color:#4ade80}
.choice-btn.wrong{background:rgba(248,113,113,0.2);border-color:#f87171;color:#f87171}
.submit-btn{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#0a1628;font-weight:600;padding:10px 28px;border-radius:10px;border:none;cursor:pointer;font-family:'Noto Sans SC',sans-serif;font-size:15px;transition:all .2s}
.submit-btn:hover{transform:scale(1.03);box-shadow:0 0 20px rgba(74,222,128,0.3)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.back-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#94a3b8;padding:8px 20px;border-radius:8px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .2s}
.back-btn:hover{background:rgba(255,255,255,0.12);color:#e2e8f0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500}
.tag-fill{background:rgba(74,222,128,0.15);color:#4ade80}
.tag-choice{background:rgba(96,165,250,0.15);color:#60a5fa}
.result-correct{color:#4ade80}
.result-wrong{color:#f87171}
.group-btn{position:relative;overflow:hidden;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px 20px;cursor:pointer;transition:all .3s;text-align:center}
.group-btn:hover{background:rgba(255,255,255,0.08);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;border:1px solid rgba(74,222,128,0.3);color:#4ade80;padding:12px 24px;border-radius:12px;font-size:14px;z-index:999;transition:transform .3s ease;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>

  <script>
// ===== SDK INIT =====
const defaultConfig = {
  main_title: '社区菜园练习',
  background_color: '#0a1628',
  surface_color: 'rgba(255,255,255,0.06)',
  text_color: '#e2e8f0',
  primary_action_color: '#4ade80',
  secondary_action_color: '#60a5fa'
};



// Data SDK - write only

// ===== NAVIGATION =====
function showPage(page) {
  ['home','exercise1','exercise2','group','exercise3','ex3-task'].forEach(p => {
    document.getElementById('page-'+p).style.display = 'none';
  });
  const el = document.getElementById('page-'+page);
  el.style.display = 'block';
  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
  document.querySelector('.app-wrap').scrollTop = 0;
  if(page==='exercise1' && !ex1Built) buildExercise1();
  lucide.createIcons();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ===== EXERCISE 1 DATA =====
const ex1Data = [
  {id:'s1',type:'label',text:'【开场 0:00–0:35】大家好！我是莎莎。最近，我在社交媒体上看到我们家附近的社区菜园，上了新闻。今天，就让我带领大家一起去参观这个社区菜园！'},
  {id:'s2',type:'label',text:'【菜园全貌 0:35–1:00】这里就是我们的社区菜园了！一眼望过去，菜园里的植物很茂盛，一片______的，真好看！'},
  {id:'f1',type:'fill',prompt:'菜园里的植物很茂盛，一片______的',answer:'绿油油'},
  {id:'s3',type:'label',text:'【土壤与种植 1:00–1:30】空气好清新！还可以闻到一点______。菜园里有______的花床，还搭了许多架子。'},
  {id:'f2',type:'fill',prompt:'还可以闻到一点______',answer:'淡淡的泥土的芬芳'},
  {id:'f3',type:'fill',prompt:'菜园里有______的花床',answer:'排列整齐'},
  {id:'c1',type:'choice',prompt:'这里从哪两方面进行描述？（选两项）',options:['形态','色彩','声音','气味'],answers:['形态','气味']},
  {id:'s4',type:'label',text:'【葱 1:30–2:05】"阿姨，您是在施肥吗？""是的，这是蔬菜的幼苗，我们每个星期都要施肥。""辛苦您了，这真不简单啊！""不会""欸！那______的是什么蔬菜？"哦！原来是葱！'},
  {id:'f4',type:'fill',prompt:'那______的是什么蔬菜？',answer:'颜色翠绿'},
  {id:'s5',type:'label',text:'【百香果 2:05–2:30】这是百香果！它______的，像绿色的______，这果子，还挺重的呢！'},
  {id:'f5',type:'fill',prompt:'它______的',answer:'圆滚滚'},
  {id:'f6',type:'fill',prompt:'像绿色的______',answer:'小皮球'},
  {id:'c2',type:'choice',prompt:'百香果的描述从哪方面进行？用了什么修辞手法？（各选一项）',options:['形态','色彩','声音','气味'],answers:['形态'],group:'c2a'},
  {id:'c2b',type:'choice',prompt:'修辞手法：',options:['比喻','比拟','排比'],answers:['比喻'],group:'c2b'},
  {id:'s6',type:'label',text:'【羊角豆 2:30–3:00】你们看！这些羊角豆像不像我们______呢！'},
  {id:'f7',type:'fill',prompt:'这些羊角豆像不像我们______呢',answer:'美丽细长的手指'},
  {id:'s7',type:'label',text:'【蝶豆花 3:00–3:35】好美啊！这些蓝色的蝶豆花在一片绿叶中特别亮眼，它们就像______在翩翩起舞！'},
  {id:'f8',type:'fill',prompt:'它们就像______在翩翩起舞',answer:'一只只美丽的蝴蝶'},
  {id:'c3',type:'choice',prompt:'蝶豆花的描述从哪方面进行？（选一项）',options:['形态','色彩','声音','气味'],answers:['色彩'],group:'c3a'},
  {id:'c3b',type:'choice',prompt:'用了什么修辞手法？',options:['比喻','比拟','排比'],answers:['比喻'],group:'c3b'},
  {id:'s8',type:'label',text:'【辣椒 3:35–3:55】这是我最喜欢的辣椒！看那______的颜色，吃起来一定很辣！'},
  {id:'f9',type:'fill',prompt:'看那______的颜色',answer:'鲜红'},
  {id:'c4',type:'choice',prompt:'辣椒的描述从哪两方面进行？（选两项）',options:['形态','色彩','声音','气味'],answers:['色彩','气味']},
  {id:'s9',type:'label',text:'【班兰叶 3:55–4:01】这是什么？有一股______，啊！原来是班兰叶！我妈妈常常用它来煮甜品。'},
  {id:'f10',type:'fill',prompt:'有一股______',answer:'淡淡的清香'},
];

let ex1Built = false;
let ex1Answers = {};
let ex1Checked = false;

function buildExercise1() {
  ex1Built = true;
  const container = document.getElementById('ex1-questions');
  let html = '';
  let qNum = 0;
  ex1Data.forEach(item => {
    if(item.type === 'label') {
      html += `<div class="glass q-card" style="border-radius:12px;padding:16px 18px;margin-bottom:12px"><p style="color:#94a3b8;font-size:14px;line-height:1.8">${item.text}</p></div>`;
    } else if(item.type === 'fill') {
      qNum++;
      html += `<div class="glass q-card" style="border-radius:12px;padding:16px 18px;margin-bottom:12px" id="q-${item.id}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="tag tag-fill">填充题</span><span style="color:#64748b;font-size:12px">第${qNum}题</span></div>
        <p style="color:#cbd5e1;font-size:14px;margin-bottom:10px">${item.prompt}</p>
        <input type="text" id="input-${item.id}" placeholder="请填写答案" oninput="ex1Answers['${item.id}']=this.value">
        <div id="fb-${item.id}" style="margin-top:8px;font-size:13px;display:none"></div>
      </div>`;
    } else if(item.type === 'choice') {
      qNum++;
      const multi = item.answers.length > 1;
      html += `<div class="glass q-card" style="border-radius:12px;padding:16px 18px;margin-bottom:12px" id="q-${item.id}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="tag tag-choice">选择题</span><span style="color:#64748b;font-size:12px">第${qNum}题${multi?' (多选)':''}</span></div>
        <p style="color:#cbd5e1;font-size:14px;margin-bottom:12px">${item.prompt}</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px" id="opts-${item.id}">
          ${item.options.map(o => `<button class="choice-btn" data-qid="${item.id}" data-val="${o}" onclick="toggleChoice('${item.id}','${o}',${multi})">${o}</button>`).join('')}
        </div>
        <div id="fb-${item.id}" style="margin-top:8px;font-size:13px;display:none"></div>
      </div>`;
      if(!ex1Answers[item.id]) ex1Answers[item.id] = [];
    }
  });
  container.innerHTML = html;
  lucide.createIcons();
}

function toggleChoice(qid, val, multi) {
  if(ex1Checked) return;
  if(!ex1Answers[qid]) ex1Answers[qid] = [];
  const arr = ex1Answers[qid];
  const idx = arr.indexOf(val);
  if(idx > -1) arr.splice(idx,1); else { if(!multi) arr.length=0; arr.push(val); }
  document.querySelectorAll(`[data-qid="${qid}"]`).forEach(btn => {
    btn.classList.toggle('selected', arr.includes(btn.dataset.val));
  });
}

function checkExercise1() {
  if(ex1Checked) return;
  ex1Checked = true;
  let correct = 0, total = 0;
  ex1Data.forEach(item => {
    if(item.type === 'fill') {
      total++;
      const val = (ex1Answers[item.id]||'').trim();
      const fb = document.getElementById('fb-'+item.id);
      fb.style.display = 'block';
      if(val === item.answer) {
        correct++;
        fb.innerHTML = `<span class="result-correct">✓ 正确！</span>`;
      } else {
        fb.innerHTML = `<span class="result-wrong">✗ 正确答案：${item.answer}</span>`;
      }
    } else if(item.type === 'choice') {
      total++;
      const sel = ex1Answers[item.id]||[];
      const fb = document.getElementById('fb-'+item.id);
      fb.style.display = 'block';
      const isCorrect = item.answers.length===sel.length && item.answers.every(a=>sel.includes(a));
      if(isCorrect) { correct++; fb.innerHTML=`<span class="result-correct">✓ 正确！</span>`; }
      else { fb.innerHTML=`<span class="result-wrong">✗ 正确答案：${item.answers.join('、')}</span>`; }
      document.querySelectorAll(`[data-qid="${item.id}"]`).forEach(btn => {
        if(item.answers.includes(btn.dataset.val)) btn.classList.add('correct');
        else if(sel.includes(btn.dataset.val)) btn.classList.add('wrong');
      });
    }
  });
  document.getElementById('ex1-score').innerHTML = `<div class="glass" style="display:inline-block;border-radius:12px;padding:16px 28px"><span style="color:#e2e8f0;font-size:18px;font-weight:600">${correct}/${total}</span><span style="color:#64748b;font-size:14px;margin-left:8px">答对</span></div>`;
  document.getElementById('ex1-submit').disabled = true;
}
